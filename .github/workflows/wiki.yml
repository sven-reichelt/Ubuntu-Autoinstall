name: Wiki

# Mirrors docs/ into the GitHub wiki so the wiki always matches main.
# docs/ is the source of truth - direct edits in the wiki are overwritten.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '.github/scripts/build-wiki.sh'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never let two syncs push to the wiki at the same time.
concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  sync:
    name: Render docs/ and push to the wiki
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Render the wiki pages
        run: |
          chmod +x .github/scripts/build-wiki.sh
          .github/scripts/build-wiki.sh "$RUNNER_TEMP/wiki-pages"

      # The wiki lives in its own repository, <repo>.wiki.git. GitHub only
      # creates it once a first page has been made through the web interface -
      # until then the clone fails, so say so clearly instead of dumping a raw
      # git error.
      - name: Clone the wiki repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git clone --depth 1 \
               "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" \
               "$RUNNER_TEMP/wiki-repo"; then
            echo "::error::The wiki repository does not exist yet."
            echo "::error::One-time setup: open https://github.com/${GITHUB_REPOSITORY}/wiki,"
            echo "::error::create any page (the next sync overwrites it), then re-run this workflow."
            exit 1
          fi

      - name: Copy the rendered pages
        run: |
          # Remove the existing pages first so deleted docs disappear from the
          # wiki as well. Everything outside *.md (i.e. .git) is left alone.
          find "$RUNNER_TEMP/wiki-repo" -maxdepth 1 -name '*.md' -delete
          cp "$RUNNER_TEMP"/wiki-pages/*.md "$RUNNER_TEMP/wiki-repo/"
          ls -l "$RUNNER_TEMP/wiki-repo"

      - name: Commit and push
        working-directory: ${{ runner.temp }}/wiki-repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki is already up to date - nothing to push."
            exit 0
          fi
          git commit -m "Sync wiki from docs/ (${GITHUB_SHA:0:7})"
          git push
          echo "Wiki updated: https://github.com/${GITHUB_REPOSITORY}/wiki"
