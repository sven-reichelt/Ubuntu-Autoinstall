name: CI

# Checks the scripts, the autoinstall configuration and the script manifest on
# every push and pull request.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Shell + autoinstall + manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Provide PyYAML
        run: python3 -m pip install --quiet --break-system-packages pyyaml

      - name: Install ShellCheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck

      - name: Run validation (bash -n, ShellCheck, YAML, manifest)
        run: |
          chmod +x validate.sh
          ./validate.sh
